<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陳鶴文 開幕茶會邀請函</title>
<meta name="description" content="陳鶴文競選總部開幕茶會 — 動態電子邀請函">
<style>
  :root{
    --coral:#F58881; --coral-deep:#E06A6B; --coral-dark:#CF5A60;
    --coral-low:#F6AA9A; --cream:#FDD9CC; --cream-soft:#FBEADF;
    --ink:#7a3a3c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Noto Serif CJK TC","Songti TC","Source Han Serif TC",serif;
    background:
      radial-gradient(130% 90% at 50% -10%, #F9A79C 0%, var(--coral) 42%, var(--coral-deep) 100%);
    color:var(--cream-soft);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .hidden{display:none;}

  /* ---------- soft ambient glow ---------- */
  body::before{
    content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
    background:radial-gradient(40% 32% at 22% 20%, rgba(255,255,255,.28), transparent 60%),
               radial-gradient(44% 36% at 82% 78%, rgba(255,210,195,.30), transparent 62%);
    animation:glow 9s ease-in-out infinite alternate;
  }
  @keyframes glow{from{opacity:.65;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}

  /* ---------- petals ---------- */
  .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2;}
  .petal{position:absolute;bottom:-40px;border-radius:60% 40% 55% 45%;
    background:linear-gradient(160deg, rgba(255,255,255,.9), rgba(253,217,204,.55));
    opacity:0;filter:blur(.3px);animation:rise linear infinite;}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
    10%{opacity:.9}
    90%{opacity:.8}
    100%{transform:translateY(-118vh) translateX(var(--dx)) rotate(320deg);opacity:0}
  }

  /* ---------- COVER ---------- */
  #cover{z-index:5;cursor:pointer;}
  .cover-wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
    transform:translateY(8px);animation:coverIn 1.25s cubic-bezier(.19,1,.22,1) both;}
  @keyframes coverIn{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:translateY(8px) scale(1)}}
  .cover-card{
    position:relative;width:min(90vw,520px);border-radius:20px;overflow:hidden;
    background:#fff;padding:8px;
    box-shadow:0 26px 60px -18px rgba(120,40,45,.55), 0 6px 18px rgba(120,40,45,.28),
               0 0 0 1px rgba(255,255,255,.4) inset;
    animation:floatCard 6s ease-in-out infinite;transform-origin:top center;
    transition:transform .85s cubic-bezier(.6,.05,.2,1), opacity .7s ease, filter .7s ease;
  }
  @keyframes floatCard{0%,100%{transform:translateY(0) rotate(-.2deg)}50%{transform:translateY(-10px) rotate(.3deg)}}
  .cover-card img{display:block;width:100%;border-radius:13px;}
  .cover-card .frame{position:absolute;inset:8px;border-radius:13px;border:1px solid rgba(255,255,255,.55);pointer-events:none;}
  /* light sweep */
  .shimmer{position:absolute;inset:0;border-radius:13px;pointer-events:none;overflow:hidden;z-index:4;}
  .shimmer::after{content:"";position:absolute;top:-60%;left:-40%;width:40%;height:220%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(18deg);animation:sweep 5.5s ease-in-out infinite;}
  @keyframes sweep{0%{left:-45%}55%{left:125%}100%{left:125%}}
  /* corner sparkles */
  .spark{position:absolute;width:12px;height:12px;z-index:5;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.7) 30%,transparent 70%);
    animation:tw 2.8s ease-in-out infinite;}
  .spark::before,.spark::after{content:"";position:absolute;inset:0;background:inherit;}
  .s1{top:-6px;left:10%;animation-delay:.2s}
  .s2{top:14%;right:-6px;width:9px;height:9px;animation-delay:1.1s}
  .s3{bottom:-6px;right:22%;width:10px;height:10px;animation-delay:1.9s}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}

  .open-hint{margin-top:30px;position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:7px;
    animation:hintIn 1.2s 1s both;}
  @keyframes hintIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .pulse-ring{position:relative;width:16px;height:16px;border-radius:50%;background:var(--cream-soft);
    box-shadow:0 0 14px rgba(255,255,255,.8);}
  .pulse-ring::before,.pulse-ring::after{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid rgba(255,255,255,.7);animation:ring 2.4s ease-out infinite;}
  .pulse-ring::after{animation-delay:1.2s;}
  @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
  .hint-text{font-size:17px;letter-spacing:4px;text-shadow:0 2px 10px rgba(130,45,50,.5);font-weight:600;}
  .chev{font-size:26px;line-height:.6;opacity:.85;animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  .flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(255,250,235,.95), rgba(255,220,200,.55) 38%, transparent 70%);}
  .flash.go{animation:flash 1s ease-out;}
  @keyframes flash{0%{opacity:0;transform:scale(.6)}18%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

  .cover-card.open{transform:translateY(-34px) rotateX(-82deg) scale(1.02);opacity:0;filter:brightness(1.4) blur(2px);}
  .cover-wrap.open .open-hint{opacity:0;transition:opacity .4s ease;}

  /* ---------- INNER ---------- */
  #inner{z-index:4;}
  .inner-scroll{position:relative;z-index:3;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;padding:26px 0 46px;-webkit-overflow-scrolling:touch;}
  .inner-card{width:min(94vw,470px);border-radius:20px;overflow:hidden;background:var(--coral);
    box-shadow:0 30px 70px -22px rgba(120,40,45,.6), 0 0 0 1px rgba(255,255,255,.35) inset;
    transform:translateY(26px) scale(.955);opacity:0;}
  .inner-card.show{animation:cardRise 1s cubic-bezier(.19,1,.22,1) forwards;}
  @keyframes cardRise{to{transform:translateY(0) scale(1);opacity:1}}
  .band{display:block;width:100%;overflow:hidden;
    clip-path:inset(0 0 100% 0);opacity:0;filter:blur(7px);
    transition:clip-path 1s cubic-bezier(.4,0,.2,1), opacity 1s ease, filter 1s ease;}
  .band img{display:block;width:100%;}
  .band.reveal{clip-path:inset(0 0 0 0);opacity:1;filter:blur(0);}

  .inner-footer{margin:22px 0 4px;font-size:15px;letter-spacing:6px;color:var(--cream-soft);
    opacity:0;text-shadow:0 2px 10px rgba(130,45,50,.45);transition:opacity 1s ease;}
  .inner-footer.reveal{opacity:.95;}

  .scroll-cue{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:12;
    font-size:30px;line-height:1;color:var(--cream-soft);text-shadow:0 2px 10px rgba(130,45,50,.6);
    opacity:0;pointer-events:none;animation:cueIn .8s 2.2s forwards, bob 1.8s 2.2s ease-in-out infinite;}
  @keyframes cueIn{to{opacity:.9}}
  .scroll-cue.gone{opacity:0 !important;animation:none;transition:opacity .5s ease;}

  .replay{position:fixed;top:14px;right:14px;z-index:20;
    font-family:inherit;font-size:13px;letter-spacing:2px;color:var(--cream-soft);
    background:rgba(120,45,50,.34);border:1px solid rgba(255,255,255,.45);
    padding:7px 13px;border-radius:30px;cursor:pointer;backdrop-filter:blur(4px);
    opacity:0;animation:cueIn .8s 2.4s forwards;transition:background .2s;}
  .replay:hover{background:rgba(120,45,50,.55);}

  @media (max-width:380px){ .hint-text{font-size:15px;letter-spacing:3px;} }
</style>
</head>

    <div class="scroll-cue" id="scrollCue">&#8964;</div>
    <button class="replay" id="replay">&#8635; 重新播放</button>

<script>
(function(){
  function makePetals(host, n){
    for(var i=0;i<n;i++){
      var p=document.createElement('div'); p.className='petal';
      var s=6+Math.random()*16;
      p.style.width=s+'px'; p.style.height=(s*0.78)+'px';
      p.style.left=(Math.random()*100)+'%';
      p.style.setProperty('--dx',(Math.random()*120-60)+'px');
      var dur=9+Math.random()*9;
      p.style.animationDuration=dur+'s';
      p.style.animationDelay=(-Math.random()*dur)+'s';
      p.style.opacity=0.5+Math.random()*0.4;
      host.appendChild(p);
    }
  }
  makePetals(document.getElementById('petalsCover'), 14);

  // gentle open chime via WebAudio (needs user gesture = the tap)
  function chime(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      var ctx=new AC();
      [ [784.0,0], [1046.5,.14], [1318.5,.28] ].forEach(function(n){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=n[0];
        var t=ctx.currentTime+n[1];
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.09,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t+1.7);
      });
    }catch(e){}
  }

  var opened=false;
  var cover=document.getElementById('cover');
  var coverWrap=document.getElementById('coverWrap');
  var coverCard=document.getElementById('coverCard');
  var inner=document.getElementById('inner');
  var innerCard=document.getElementById('innerCard');
  var flash=document.getElementById('flash');
  var bands=document.querySelectorAll('.band');
  var footer=document.getElementById('footer');

  function open(){
    if(opened) return; opened=true;
    chime();
    flash.classList.add('go');
    coverWrap.classList.add('open');
    coverCard.classList.add('open');
    setTimeout(function(){
      cover.classList.add('hidden');
      inner.classList.remove('hidden');
      makePetals(document.getElementById('petalsInner'), 10);
      void innerCard.offsetWidth;
      innerCard.classList.add('show');
      bands.forEach(function(b,i){ setTimeout(function(){ b.classList.add('reveal'); }, 380 + i*300); });
      setTimeout(function(){ footer.classList.add('reveal'); }, 380 + bands.length*300 + 200);
    }, 760);
  }
  cover.addEventListener('click', open);

  // scroll cue hide
  var sc=document.getElementById('scrollCue');
  var scroller=document.getElementById('innerScroll');
  scroller.addEventListener('scroll', function(){
    if(scroller.scrollTop>20){ sc.classList.add('gone'); }
  });

  // replay
  document.getElementById('replay').addEventListener('click', function(e){
    e.stopPropagation();
    opened=false;
    inner.classList.add('hidden');
    innerCard.classList.remove('show');
    bands.forEach(function(b){ b.classList.remove('reveal'); });
    footer.classList.remove('reveal');
    sc.classList.remove('gone');
    scroller.scrollTop=0;
    document.getElementById('petalsInner').innerHTML='';
    flash.classList.remove('go');
    coverWrap.classList.remove('open');
    coverCard.classList.remove('open');
    cover.classList.remove('hidden');
    void coverWrap.offsetWidth;
    coverWrap.style.animation='none'; void coverWrap.offsetWidth; coverWrap.style.animation='';
  });
})();
</script>
